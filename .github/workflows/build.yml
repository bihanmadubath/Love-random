name: Build & Release

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Build Release AAB
        env:
          KSP_INCREMENTAL: "false"
        run: |
          echo "ksp.incremental=false" >> gradle.properties
          echo "org.gradle.jvmargs=-Djava.awt.headless=true" >> gradle.properties
          gradle bundleRelease -Pksp.incremental=false -Djava.awt.headless=true -x lintVitalAnalyzeRelease -x lintVitalReportRelease -x lintVitalRelease --no-daemon --stacktrace
      - name: Build Release APK
        run: gradle assembleRelease -Pksp.incremental=false -Djava.awt.headless=true -x lintVitalAnalyzeRelease -x lintVitalReportRelease -x lintVitalRelease --no-daemon
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: LoveRandom-RELEASE-AAB
          path: app/build/outputs/bundle/release/*.aab
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LoveRandom-TEST-APK
          path: app/build/outputs/apk/release/*.apk
