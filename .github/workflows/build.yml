name: Build & Release

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Fix KSP AWT Bug
        run: |
          echo "ksp.incremental=false" >> gradle.properties
          echo "ksp.incremental.intermodule=false" >> gradle.properties
          echo "org.gradle.configuration-cache=false" >> gradle.properties
          echo "org.gradle.jvmargs=-Djava.awt.headless=true -Xmx4g" >> gradle.properties

      - name: Build Release AAB
        run: gradle bundleRelease --no-configuration-cache --no-daemon -Djava.awt.headless=true -Pksp.incremental=false -x lintVitalAnalyzeRelease -x lintVitalReportRelease -x lintVitalRelease

      - name: Build Release APK
        run: gradle assembleRelease --no-configuration-cache --no-daemon -Djava.awt.headless=true -Pksp.incremental=false -x lintVitalAnalyzeRelease -x lintVitalReportRelease -x lintVitalRelease

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: LoveRandom-RELEASE-AAB
          path: app/build/outputs/bundle/release/*.aab

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LoveRandom-TEST-APK
          path: app/build/outputs/apk/release/*.apk
