name: Build & Release

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v3
      - name: Prepare Keystore
        run: |
          cp my-upload-key.jks app/my-upload-key.jks
          echo "ksp.incremental=false" >> gradle.properties
          echo "org.gradle.jvmargs=-Djava.awt.headless=true -Xmx4g" >> gradle.properties
      - name: Build AAB
        run: gradle bundleRelease --no-daemon -Djava.awt.headless=true -Pksp.incremental=false -x lintVitalRelease
      - name: Build APK
        run: gradle assembleRelease --no-daemon -Djava.awt.headless=true -Pksp.incremental=false -x lintVitalRelease
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: LoveRandom-RELEASE-AAB
          path: app/build/outputs/bundle/release/*.aab
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LoveRandom-TEST-APK
          path: app/build/outputs/apk/release/*.apk
